[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choochoose"
version = "0.1.0"
description = "choochoose: a privacy-respecting KTX/SRT reservation helper (choo-choo, meet choose-your-train)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "junheo" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "click",
    "curl_cffi",
    "requests",
    "inquirer>=3.4",
    "keyring",
    "PyCryptodome",
    "prompt_toolkit>=3",
    "python-telegram-bot",
    "termcolor",
]

[project.scripts]
choochoose = "choochoose.cli:choochoose"

[tool.setuptools]
packages = ["choochoose"]
